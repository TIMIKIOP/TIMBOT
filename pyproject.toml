[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "timbot"
version = "0.1.0"
description = "Multi-tenant AI customer support and sales automation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "sqlalchemy>=2.0,<3.0", "alembic>=1.13,<2.0", "pydantic-settings>=2.5,<3.0", "python-jose[cryptography]>=3.3,<4.0", "pwdlib[argon2]>=0.2,<1.0", "psycopg[binary]>=3.2,<4.0", "pgvector>=0.3,<1.0", "python-multipart>=0.0.12,<1.0", "openai>=1.60,<3.0", "openpyxl>=3.1,<4.0", "pypdf>=5.0,<7.0", "celery[redis]>=5.4,<6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0"]


[tool.setuptools.packages.find]
where = ["backend"]
include = ["timbot*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
norecursedirs = ["work", ".venv", "node_modules", "outputs"]
